name: Releases

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Release Variables
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          
          # Check if the tag represents a pre-release (e.g. v1.2.0-beta.1, v1.2.0-rc1, etc.)
          if [[ "$TAG_NAME" == *-* ]] || [[ "$TAG_NAME" =~ (beta|alpha|rc|preview) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Run Tests
        run: swift test

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install Tools
        run: |
          brew install create-dmg

      - name: Generate Icon
        run: |
          chmod +x generate_icon.sh
          ./generate_icon.sh

      - name: Build Universal Binary
        run: |
          # Build for x86_64
          swift build -c release --arch x86_64
          # Build for arm64
          swift build -c release --arch arm64
          
          # Create directory for universal binary
          mkdir -p .build/universal
          
          # Merge binaries using lipo
          lipo -create -output .build/universal/XPlaneLauncher \
            .build/x86_64-apple-macosx/release/XPlaneLauncher \
            .build/arm64-apple-macosx/release/XPlaneLauncher
            
          # Verify architecture
          lipo -info .build/universal/XPlaneLauncher

      - name: Create App Bundle
        run: |
          chmod +x package.sh
          # Run package script to create structure with universal binary
          ./package.sh --skip-build --binary .build/universal/XPlaneLauncher
          
          # Update Version in Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" XLauncher.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" XLauncher.app/Contents/Info.plist
          
          echo "Signing Sparkle framework and app bundle with Developer ID and Hardened Runtime..."
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application" \
            XLauncher.app/Contents/Frameworks/Sparkle.framework

          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application" \
            --entitlements entitlements.plist \
            XLauncher.app

      - name: Create DMG
        run: |
          create-dmg \
            --volname "XLauncher Installer" \
            --volicon "XLauncher.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "XLauncher.app" 200 190 \
            --hide-extension "XLauncher.app" \
            --app-drop-link 600 185 \
            "XLauncher.dmg" \
            "XLauncher.app"

      - name: Sign & Notarize DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "Signing DMG..."
          codesign --force --timestamp \
            --sign "Developer ID Application" \
            XLauncher.dmg

          echo "Setting up Apple API Key..."
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          echo "Submitting DMG to Apple Notary Service..."
          xcrun notarytool submit XLauncher.dmg \
            --key "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          echo "Stapling notarization ticket to DMG and App..."
          xcrun stapler staple XLauncher.dmg
          xcrun stapler staple XLauncher.app || true

          echo "Validating notarization ticket..."
          xcrun stapler validate XLauncher.dmg

      - name: Create Sparkle Update Archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "Creating ZIP archive of app bundle..."
          ditto -c -k --keepParent XLauncher.app XLauncher-macOS.zip

          GENERATE_APPCAST=$(find .build -name "generate_appcast" -type f | head -n 1)
          if [ -n "$SPARKLE_PRIVATE_KEY" ] && [ -n "$GENERATE_APPCAST" ]; then
            echo "Generating Sparkle appcast.xml..."
            mkdir -p sparkle_staging
            cp XLauncher-macOS.zip sparkle_staging/
            echo "$SPARKLE_PRIVATE_KEY" > sparkle_key.txt
            DOWNLOAD_PREFIX="https://github.com/jcorbier/XLauncher/releases/download/${TAG_NAME}/"

            CHANNEL_ARGS=""
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "Tagging appcast item with beta channel..."
              CHANNEL_ARGS="--channel beta"
            fi

            "$GENERATE_APPCAST" --download-url-prefix "$DOWNLOAD_PREFIX" $CHANNEL_ARGS --ed-key-file sparkle_key.txt sparkle_staging/ || true
            if [ -f "sparkle_staging/appcast.xml" ]; then
              cp sparkle_staging/appcast.xml ./appcast.xml
            fi
            rm -f sparkle_key.txt
          fi

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/.private_keys

      - name: Generate Changelog
        run: |
          chmod +x generate_changelog.sh
          ./generate_changelog.sh RELEASE_CHANGELOG.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            XLauncher.dmg
            XLauncher-macOS.zip
            appcast.xml
          body_path: RELEASE_CHANGELOG.md
          prerelease: ${{ steps.vars.outputs.prerelease }}
          name: ${{ steps.vars.outputs.release_name }}
          tag_name: ${{ steps.vars.outputs.tag_name }}

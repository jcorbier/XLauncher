name: Releases

on:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  release:
    name: Build & Release
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Release Variables
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
            echo "IS_DRAFT=false" >> $GITHUB_ENV
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
            
            # Check if the tag represents a pre-release (e.g. v1.2.0-beta.1, v1.2.0-rc1, etc.)
            if [[ "$TAG_NAME" == *-* ]] || [[ "$TAG_NAME" =~ (beta|alpha|rc|preview) ]]; then
              echo "IS_PRERELEASE=true" >> $GITHUB_ENV
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "IS_PRERELEASE=false" >> $GITHUB_ENV
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            echo "release_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "IS_DRAFT=true" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "VERSION=0.0.0-draft" >> $GITHUB_ENV
            echo "TAG_NAME=rolling-draft" >> $GITHUB_ENV
            
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=Rolling Draft" >> "$GITHUB_OUTPUT"
            echo "tag_name=rolling-draft" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Run Tests
        run: |
          if [ "$IS_DRAFT" = "false" ]; then
            swift test
          fi

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ "$IS_DRAFT" = "false" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

            security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
            security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH"

            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          fi

      - name: Install Tools
        run: |
          brew install create-dmg

      - name: Generate Icon
        run: |
          chmod +x generate_icon.sh
          ./generate_icon.sh

      - name: Build Universal Binary
        run: |
          # Build for x86_64
          swift build -c release --arch x86_64
          # Build for arm64
          swift build -c release --arch arm64
          
          # Create directory for universal binary
          mkdir -p .build/universal
          
          # Merge binaries using lipo
          lipo -create -output .build/universal/XPlaneLauncher \
            .build/x86_64-apple-macosx/release/XPlaneLauncher \
            .build/arm64-apple-macosx/release/XPlaneLauncher
            
          # Verify architecture
          lipo -info .build/universal/XPlaneLauncher

      - name: Create App Bundle
        run: |
          chmod +x package.sh
          # Run package script to create structure without rebuilding single arch
          ./package.sh --skip-build
          
          # Overwrite with universal binary
          cp .build/universal/XPlaneLauncher XLauncher.app/Contents/MacOS/XLauncher
          
          # Update Version in Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" XLauncher.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" XLauncher.app/Contents/Info.plist
          
          if [ "$IS_DRAFT" = "false" ]; then
            echo "Signing app bundle with Developer ID and Hardened Runtime..."
            codesign --force --deep --options runtime --timestamp \
              --sign "Developer ID Application" \
              --entitlements entitlements.plist \
              XLauncher.app
          else
            codesign -f -s - XLauncher.app
          fi

      - name: Create DMG
        run: |
          create-dmg \
            --volname "XLauncher Installer" \
            --volicon "XLauncher.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "XLauncher.app" 200 190 \
            --hide-extension "XLauncher.app" \
            --app-drop-link 600 185 \
            "XLauncher.dmg" \
            "XLauncher.app"

      - name: Sign & Notarize DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$IS_DRAFT" = "false" ]; then
            echo "Signing DMG..."
            codesign --force --timestamp \
              --sign "Developer ID Application" \
              XLauncher.dmg

            echo "Setting up Apple API Key..."
            mkdir -p ~/.private_keys
            echo "$APPLE_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

            echo "Submitting DMG to Apple Notary Service..."
            xcrun notarytool submit XLauncher.dmg \
              --key "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait

            echo "Stapling notarization ticket to DMG..."
            xcrun stapler staple XLauncher.dmg

            echo "Validating notarization ticket..."
            xcrun stapler validate XLauncher.dmg
          fi

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/.private_keys

      - name: Generate Changelog
        run: |
          chmod +x generate_changelog.sh
          ./generate_changelog.sh RELEASE_CHANGELOG.md

      - name: Delete Previous Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete rolling-draft --cleanup-tag -y || true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: XLauncher.dmg
          body_path: RELEASE_CHANGELOG.md
          prerelease: ${{ steps.vars.outputs.prerelease }}
          name: ${{ steps.vars.outputs.release_name }}
          tag_name: ${{ steps.vars.outputs.tag_name }}

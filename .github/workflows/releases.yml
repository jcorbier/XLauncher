name: Releases

on:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  release:
    name: Build & Release
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Release Variables
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
            echo "IS_DRAFT=false" >> $GITHUB_ENV
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
            
            # Check if the tag represents a pre-release (e.g. v1.2.0-beta.1, v1.2.0-rc1, etc.)
            if [[ "$TAG_NAME" == *-* ]] || [[ "$TAG_NAME" =~ (beta|alpha|rc|preview) ]]; then
              echo "IS_PRERELEASE=true" >> $GITHUB_ENV
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "IS_PRERELEASE=false" >> $GITHUB_ENV
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            echo "release_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "IS_DRAFT=true" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "VERSION=0.0.0-draft" >> $GITHUB_ENV
            echo "TAG_NAME=rolling-draft" >> $GITHUB_ENV
            
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=Rolling Draft" >> "$GITHUB_OUTPUT"
            echo "tag_name=rolling-draft" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install Tools
        run: |
          brew install create-dmg

      - name: Generate Icon
        run: |
          chmod +x generate_icon.sh
          ./generate_icon.sh

      - name: Build Universal Binary
        run: |
          # Build for x86_64
          swift build -c release --arch x86_64
          # Build for arm64
          swift build -c release --arch arm64
          
          # Create directory for universal binary
          mkdir -p .build/universal
          
          # Merge binaries using lipo
          lipo -create -output .build/universal/XPlaneLauncher \
            .build/x86_64-apple-macosx/release/XPlaneLauncher \
            .build/arm64-apple-macosx/release/XPlaneLauncher
            
          # Verify architecture
          lipo -info .build/universal/XPlaneLauncher

      - name: Create App Bundle
        run: |
          chmod +x package.sh
          # Run package script to create structure without rebuilding single arch
          ./package.sh --skip-build
          
          # Overwrite with universal binary
          cp .build/universal/XPlaneLauncher XLauncher.app/Contents/MacOS/XLauncher
          
          # Update Version in Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" XLauncher.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" XLauncher.app/Contents/Info.plist
          
          # Resign the app after modification
          codesign -f -s - XLauncher.app

      - name: Create DMG
        run: |
          create-dmg \
            --volname "XLauncher Installer" \
            --volicon "XLauncher.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "XLauncher.app" 200 190 \
            --hide-extension "XLauncher.app" \
            --app-drop-link 600 185 \
            "XLauncher.dmg" \
            "XLauncher.app"

      - name: Generate Changelog
        run: |
          chmod +x generate_changelog.sh
          ./generate_changelog.sh RELEASE_CHANGELOG.md

      - name: Delete Previous Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete rolling-draft --cleanup-tag -y || true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: XLauncher.dmg
          body_path: RELEASE_CHANGELOG.md
          prerelease: ${{ steps.vars.outputs.prerelease }}
          name: ${{ steps.vars.outputs.release_name }}
          tag_name: ${{ steps.vars.outputs.tag_name }}
